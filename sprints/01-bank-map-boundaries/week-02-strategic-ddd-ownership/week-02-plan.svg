<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">برنامه دقیق هفته دوم Strategic DDD و مالکیت</title>
  <desc id="desc">هفت روز، ۳۶۰ دقیقه، با موضوع و خروجی هر روز</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <style>
      .fa { font-family: Vazirmatn, Tahoma, Arial, sans-serif; }
      .en { font-family: Inter, Arial, sans-serif; }
      .white { fill: #fff; }
      .ink { fill: #26113d; }
      .muted { fill: #dac7e9; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <rect x="80" y="54" width="1640" height="154" rx="28" fill="#ffffff" opacity=".07"/>
  <text x="1650" y="112" class="fa white" font-size="46" font-weight="800" text-anchor="end">هفتهٔ دوم — طراحی دامنه‌محور راهبردی و مالکیت</text>
  <text x="1650" y="165" class="fa muted" font-size="25" text-anchor="end">هفت روز · شش ساعت · از فضای مسئله تا ماژول قابل آزمون</text>
  <rect x="110" y="89" width="260" height="82" rx="41" fill="url(#accent)"/>
  <text x="240" y="141" class="fa white" font-size="25" font-weight="800" text-anchor="middle">دروازهٔ اسپرینت</text>

  <g>
    <rect x="940" y="260" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="90" y="260" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="940" y="480" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="90" y="480" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="940" y="700" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="90" y="700" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="515" y="920" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="930" y="250" width="790" height="188" rx="24" fill="#faf7ff"/>
    <rect x="80" y="250" width="790" height="188" rx="24" fill="#faf7ff"/>
    <rect x="930" y="470" width="790" height="188" rx="24" fill="#faf7ff"/>
    <rect x="80" y="470" width="790" height="188" rx="24" fill="#faf7ff"/>
    <rect x="930" y="690" width="790" height="188" rx="24" fill="#faf7ff"/>
    <rect x="80" y="690" width="790" height="188" rx="24" fill="#faf7ff"/>
    <rect x="505" y="910" width="790" height="188" rx="24" fill="#faf7ff"/>
  </g>

  <g class="fa">
    <rect x="1390" y="270" width="300" height="52" rx="26" fill="#7c3aed"/>
    <text x="1540" y="305" class="white" font-size="19" font-weight="800" text-anchor="middle">روز اول · پنجاه دقیقه</text>
    <text x="1660" y="357" class="ink" font-size="29" font-weight="800" text-anchor="end">دامین و زیردامین</text>
    <text x="1660" y="395" class="ink" font-size="20" text-anchor="end">طبقه‌بندی راهبردی در سه سطح با مثال بانکی</text>
    <text x="1010" y="416" fill="#7c3aed" font-size="18" font-weight="700">EVIDENCE: SUBDOMAIN MATRIX</text>

    <rect x="540" y="270" width="300" height="52" rx="26" fill="#7c3aed"/>
    <text x="690" y="305" class="white" font-size="18" font-weight="800" text-anchor="middle">روز دوم · چهل‌وپنج دقیقه</text>
    <text x="810" y="357" class="ink" font-size="29" font-weight="800" text-anchor="end">مدل و زبان در مرز</text>
    <text x="810" y="395" class="ink" font-size="20" text-anchor="end">مرز اعتبار مدل و زبان مشترک دامنه</text>
    <text x="160" y="416" fill="#7c3aed" font-size="18" font-weight="700">EVIDENCE: LANGUAGE CONFLICTS</text>

    <rect x="1390" y="490" width="300" height="52" rx="26" fill="#7c3aed"/>
    <text x="1540" y="525" class="white" font-size="19" font-weight="800" text-anchor="middle">روز سوم · پنجاه دقیقه</text>
    <text x="1660" y="577" class="ink" font-size="29" font-weight="800" text-anchor="end">رابطهٔ مرزهای دامینی</text>
    <text x="1660" y="615" class="ink" font-size="20" text-anchor="end">چهار الگوی اصلی رابطه، قدرت و ترجمه</text>
    <text x="1010" y="636" fill="#7c3aed" font-size="18" font-weight="700">EVIDENCE: CONTEXT MAP</text>

    <rect x="540" y="490" width="300" height="52" rx="26" fill="#7c3aed"/>
    <text x="690" y="525" class="white" font-size="18" font-weight="800" text-anchor="middle">روز چهارم · پنجاه دقیقه</text>
    <text x="810" y="577" class="ink" font-size="29" font-weight="800" text-anchor="end">مالکیت داده و تصمیم</text>
    <text x="810" y="615" class="ink" font-size="20" text-anchor="end">مرجع معتبر داده و تصمیم برای شش دامنه</text>
    <text x="160" y="636" fill="#7c3aed" font-size="18" font-weight="700">EVIDENCE: OWNERSHIP MATRIX V1</text>

    <rect x="1390" y="710" width="300" height="52" rx="26" fill="#7c3aed"/>
    <text x="1540" y="745" class="white" font-size="18" font-weight="800" text-anchor="middle">روز پنجم · صد دقیقه</text>
    <text x="1660" y="797" class="ink" font-size="29" font-weight="800" text-anchor="end">شش ماژول منطقی</text>
    <text x="1660" y="835" class="ink" font-size="20" text-anchor="end">مرز عمومی و داخلی، ماژول و وابستگی مجاز</text>
    <text x="1010" y="856" fill="#7c3aed" font-size="18" font-weight="700">EVIDENCE: MODULE SKELETON</text>

    <rect x="540" y="710" width="300" height="52" rx="26" fill="#7c3aed"/>
    <text x="690" y="745" class="white" font-size="17" font-weight="800" text-anchor="middle">روز ششم · چهل‌وپنج دقیقه</text>
    <text x="810" y="797" class="ink" font-size="29" font-weight="800" text-anchor="end">آزمون سلامت معماری</text>
    <text x="810" y="835" class="ink" font-size="20" text-anchor="end">چرخه، دسترسی داخلی و راستی‌آزمایی ماژول</text>
    <text x="160" y="856" fill="#7c3aed" font-size="18" font-weight="700">EVIDENCE: ARCHITECTURE TEST</text>

    <rect x="870" y="930" width="350" height="52" rx="26" fill="#7c3aed"/>
    <text x="1045" y="965" class="white" font-size="18" font-weight="800" text-anchor="middle">روز هفتم · بیست دقیقه</text>
    <text x="1235" y="1017" class="ink" font-size="29" font-weight="800" text-anchor="end">دروازهٔ اسپرینت اول</text>
    <text x="1235" y="1055" class="ink" font-size="20" text-anchor="end">دفاع مسدودی قضایی، از توانمندی تا رویداد</text>
    <text x="585" y="1076" fill="#7c3aed" font-size="18" font-weight="700">EVIDENCE: GATE RECORD</text>
  </g>

  <text x="90" y="1160" class="en muted" font-size="18">S01 · W02 · VERSION 1.0 · GATE: ONE OWNER PER DATA/DECISION, VERIFIED MODULE BOUNDARIES</text>
</svg>
