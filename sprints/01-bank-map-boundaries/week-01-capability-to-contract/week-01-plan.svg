<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" role="img" aria-labelledby="title desc">
  <title id="title">Week 01 — Capability to Contract learning plan</title>
  <desc id="desc">Seven core sessions totaling 360 minutes plus a 105 minute code craft lab and a 45 minute UPI case file.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#123d4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#001018" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #b9d7dc; }
      .section { font: 700 25px Arial, sans-serif; fill: #f8fafc; }
      .day { font: 700 20px Arial, sans-serif; fill: #082f49; }
      .topic { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 400 16px Arial, sans-serif; fill: #334155; }
      .time { font: 700 17px Arial, sans-serif; fill: #0f766e; }
      .foot { font: 700 18px Arial, sans-serif; fill: #dff7f4; }
    </style>
  </defs>

  <rect width="1400" height="1010" rx="28" fill="url(#bg)"/>
  <text x="700" y="62" text-anchor="middle" class="title">Week 01 — Capability تا API/Event</text>
  <text x="700" y="96" text-anchor="middle" class="subtitle">هستهٔ اصلی بدون کاهش: ۳۶۰ دقیقه | Code Craft: ۱۰۵ دقیقه | پروندهٔ UPI: ۴۵ دقیقه</text>

  <text x="85" y="148" class="section">Core track — 7 sessions</text>

  <g filter="url(#shadow)">
    <rect x="80" y="175" width="390" height="145" rx="18" fill="#e0f2fe"/>
    <text x="105" y="210" class="day">Day 01</text>
    <text x="445" y="210" text-anchor="end" class="time">60 min</text>
    <text x="105" y="248" class="topic">زبان معماری و Baseline</text>
    <text x="105" y="280" class="detail">Capability → Context → Contract</text>
    <text x="105" y="305" class="detail">شاهد: پاسخ خام + Exit Ticket</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="505" y="175" width="390" height="145" rx="18" fill="#dcfce7"/>
    <text x="530" y="210" class="day">Day 02</text>
    <text x="870" y="210" text-anchor="end" class="time">45 min</text>
    <text x="530" y="248" class="topic">Capability Distinctions</text>
    <text x="530" y="280" class="detail">Process / Service / Product / System</text>
    <text x="530" y="305" class="detail">شاهد: Distinction Matrix</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="175" width="390" height="145" rx="18" fill="#fef3c7"/>
    <text x="955" y="210" class="day">Day 03</text>
    <text x="1295" y="210" text-anchor="end" class="time">50 min</text>
    <text x="955" y="248" class="topic">Traceability Chain</text>
    <text x="955" y="280" class="detail">System تا API/Event، بدون پرش</text>
    <text x="955" y="305" class="detail">شاهد: دو زنجیرهٔ کامل</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="350" width="390" height="145" rx="18" fill="#ede9fe"/>
    <text x="105" y="385" class="day">Day 04</text>
    <text x="445" y="385" text-anchor="end" class="time">55 min</text>
    <text x="105" y="423" class="topic">Design Forces</text>
    <text x="105" y="455" class="detail">Coupling / Cohesion / Information Hiding</text>
    <text x="105" y="480" class="detail">شاهد: Coupling Review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="505" y="350" width="390" height="145" rx="18" fill="#fee2e2"/>
    <text x="530" y="385" class="day">Day 05</text>
    <text x="870" y="385" text-anchor="end" class="time">70 min</text>
    <text x="530" y="423" class="topic">Capability Map + BIAN 14</text>
    <text x="530" y="455" class="detail">L1 Map، چهارلایه و Gap Check</text>
    <text x="530" y="480" class="detail">شاهد: Map v1 + Evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="350" width="390" height="145" rx="18" fill="#cffafe"/>
    <text x="955" y="385" class="day">Day 06</text>
    <text x="1295" y="385" text-anchor="end" class="time">60 min</text>
    <text x="955" y="423" class="topic">Value Objects + Pipeline</text>
    <text x="955" y="455" class="detail">Money و Typed IDs با JUnit</text>
    <text x="955" y="480" class="detail">شاهد: mvn verify سبز</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="300" y="525" width="800" height="120" rx="18" fill="#f1f5f9"/>
    <text x="330" y="562" class="day">Day 07</text>
    <text x="1070" y="562" text-anchor="end" class="time">20 min</text>
    <text x="330" y="598" class="topic">تثبیت، گزارش و دفاع ده‌دقیقه‌ای</text>
    <text x="330" y="626" class="detail">شاهد: Evidence index + Gate حداقل ۸ از ۱۰</text>
  </g>

  <text x="85" y="705" class="section">Expanded tracks — after the core gate</text>

  <g filter="url(#shadow)">
    <rect x="80" y="735" width="610" height="175" rx="20" fill="#ccfbf1"/>
    <text x="110" y="775" class="day">Day 08 — Code Craft</text>
    <text x="660" y="775" text-anchor="end" class="time">105 min</text>
    <text x="110" y="815" class="topic">Primitive → Value Object Refactoring</text>
    <text x="110" y="848" class="detail">Characterization Test، Money، Typed IDs، Factory Decision</text>
    <text x="110" y="880" class="detail">شاهد: Baseline/Refactor سبز + Edge Test + Self-review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="710" y="735" width="610" height="175" rx="20" fill="#fde68a"/>
    <text x="740" y="775" class="day">Day 09 — Banking System Case</text>
    <text x="1290" y="775" text-anchor="end" class="time">45 min</text>
    <text x="740" y="815" class="topic">UPI هند؛ Capability تا API Network</text>
    <text x="740" y="848" class="detail">Timeline، نقش‌ها، معماری عمومی، Outage و Domain hypothesis</text>
    <text x="740" y="880" class="detail">شاهد: Fact / Inference / Unknown + ADR-lite</text>
  </g>

  <text x="700" y="968" text-anchor="middle" class="foot">Week Done — Expanded = Core Gate + Code Craft DoD + Case File DoD</text>
</svg>

