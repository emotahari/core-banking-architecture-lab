<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">برنامه دقیق هفته اول از Capability تا Contract</title>
  <desc id="desc">هفت روز، ۳۶۰ دقیقه، با موضوع و خروجی هر روز</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e2b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <style>
      .fa { font-family: Vazirmatn, Tahoma, Arial, sans-serif; }
      .en { font-family: Inter, Arial, sans-serif; }
      .white { fill: #fff; }
      .ink { fill: #102a32; }
      .muted { fill: #c0d8d5; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <rect x="80" y="54" width="1640" height="154" rx="28" fill="#ffffff" opacity=".07"/>
  <text x="1650" y="112" class="fa white" font-size="50" font-weight="800" text-anchor="end">هفتهٔ اول — از توانمندی تا رابط و رویداد</text>
  <text x="1650" y="165" class="fa muted" font-size="25" text-anchor="end">هفت روز · شش ساعت · یک خروجی قابل بررسی در پایان هر روز</text>
  <rect x="110" y="89" width="260" height="82" rx="41" fill="url(#accent)"/>
  <text x="240" y="141" class="fa white" font-size="27" font-weight="800" text-anchor="middle">۶ ساعت دقیق</text>

  <g>
    <rect x="940" y="260" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="90" y="260" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="940" y="480" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="90" y="480" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="940" y="700" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="90" y="700" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="515" y="920" width="790" height="188" rx="24" fill="#000" opacity=".18"/>
    <rect x="930" y="250" width="790" height="188" rx="24" fill="#f8fafc"/>
    <rect x="80" y="250" width="790" height="188" rx="24" fill="#f8fafc"/>
    <rect x="930" y="470" width="790" height="188" rx="24" fill="#f8fafc"/>
    <rect x="80" y="470" width="790" height="188" rx="24" fill="#f8fafc"/>
    <rect x="930" y="690" width="790" height="188" rx="24" fill="#f8fafc"/>
    <rect x="80" y="690" width="790" height="188" rx="24" fill="#f8fafc"/>
    <rect x="505" y="910" width="790" height="188" rx="24" fill="#f8fafc"/>
  </g>

  <g class="fa">
    <rect x="1390" y="270" width="300" height="52" rx="26" fill="#0f766e"/>
    <text x="1540" y="305" class="white" font-size="20" font-weight="800" text-anchor="middle">روز اول · یک ساعت</text>
    <text x="1660" y="357" class="ink" font-size="29" font-weight="800" text-anchor="end">زبان معماری و خط پایه</text>
    <text x="1660" y="395" class="ink" font-size="20" text-anchor="end">پاسخ خام → درس → Traceability → Exit Ticket</text>
    <text x="1010" y="416" fill="#0f766e" font-size="18" font-weight="700">EVIDENCE: BASELINE + QUIZ</text>

    <rect x="540" y="270" width="300" height="52" rx="26" fill="#0f766e"/>
    <text x="690" y="305" class="white" font-size="18" font-weight="800" text-anchor="middle">روز دوم · چهل‌وپنج دقیقه</text>
    <text x="810" y="357" class="ink" font-size="29" font-weight="800" text-anchor="end">توانمندی یا چیز دیگر؟</text>
    <text x="810" y="395" class="ink" font-size="20" text-anchor="end">تمایز Process، Business Service، System و API</text>
    <text x="160" y="416" fill="#0f766e" font-size="18" font-weight="700">EVIDENCE: DISTINCTION MATRIX</text>

    <rect x="1390" y="490" width="300" height="52" rx="26" fill="#0f766e"/>
    <text x="1540" y="525" class="white" font-size="19" font-weight="800" text-anchor="middle">روز سوم · پنجاه دقیقه</text>
    <text x="1660" y="577" class="ink" font-size="29" font-weight="800" text-anchor="end">از سیستم تا قرارداد</text>
    <text x="1660" y="615" class="ink" font-size="20" text-anchor="end">دو زنجیره برای اعطا و مسدودی قضایی</text>
    <text x="1010" y="636" fill="#0f766e" font-size="18" font-weight="700">EVIDENCE: 2 TRACE CHAINS</text>

    <rect x="540" y="490" width="300" height="52" rx="26" fill="#0f766e"/>
    <text x="690" y="525" class="white" font-size="17" font-weight="800" text-anchor="middle">روز چهارم · پنجاه‌وپنج دقیقه</text>
    <text x="810" y="577" class="ink" font-size="29" font-weight="800" text-anchor="end">مرز و وابستگی</text>
    <text x="810" y="615" class="ink" font-size="20" text-anchor="end">Coupling، Cohesion، Encapsulation و Hiding</text>
    <text x="160" y="636" fill="#0f766e" font-size="18" font-weight="700">EVIDENCE: COUPLING REVIEW</text>

    <rect x="1390" y="710" width="300" height="52" rx="26" fill="#0f766e"/>
    <text x="1540" y="745" class="white" font-size="19" font-weight="800" text-anchor="middle">روز پنجم · هفتاد دقیقه</text>
    <text x="1660" y="797" class="ink" font-size="29" font-weight="800" text-anchor="end">نقشهٔ توانمندی بانک</text>
    <text x="1660" y="835" class="ink" font-size="20" text-anchor="end">L1 Map → طبقه‌بندی چهارلایه → BIAN Gap Check</text>
    <text x="1010" y="856" fill="#0f766e" font-size="18" font-weight="700">EVIDENCE: CAPABILITY MAP V1</text>

    <rect x="540" y="710" width="300" height="52" rx="26" fill="#0f766e"/>
    <text x="690" y="745" class="white" font-size="19" font-weight="800" text-anchor="middle">روز ششم · یک ساعت</text>
    <text x="810" y="797" class="ink" font-size="29" font-weight="800" text-anchor="end">کد و تست شیء مقداری</text>
    <text x="810" y="835" class="ink" font-size="20" text-anchor="end">Money + Typed IDs + Equality + Validation + CI</text>
    <text x="160" y="856" fill="#0f766e" font-size="18" font-weight="700">EVIDENCE: MVN VERIFY</text>

    <rect x="870" y="930" width="350" height="52" rx="26" fill="#0f766e"/>
    <text x="1045" y="965" class="white" font-size="18" font-weight="800" text-anchor="middle">روز هفتم · بیست دقیقه</text>
    <text x="1235" y="1017" class="ink" font-size="29" font-weight="800" text-anchor="end">تثبیت و دفاع</text>
    <text x="1235" y="1055" class="ink" font-size="20" text-anchor="end">واژه‌نامه + گزارش + دفاع ده‌دقیقه‌ای</text>
    <text x="585" y="1076" fill="#0f766e" font-size="18" font-weight="700">EVIDENCE: WEEK REPORT</text>
  </g>

  <text x="90" y="1160" class="en muted" font-size="18">S01 · W01 · VERSION 1.0 · DEFINITION OF DONE: TRACEABLE CAPABILITY, OWNER, BOUNDARY, CONTRACT</text>
</svg>
