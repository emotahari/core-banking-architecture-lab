name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown-bidi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test Markdown BiDi formatter
        run: python3 -m unittest tests/test_markdown_bidi.py
      - name: Verify Persian Markdown direction
        run: python3 scripts/markdown_bidi.py --check

  banking-modulith:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/banking-modulith
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify
